    kind: model
    files: [public/models/cockpit.glb]
    generator: { script: scripts/blender/cockpit.py, recipe: make-cockpit-model }
    made_by: blender-cli
    source: 自作（car.glb のガラスと塗装面から窓の開口を求めて手続きモデリング。写真は配置の参考のみ）
    license: repo
    used_by: [src/game/cockpit.ts]
    inputs: [cockpit-textures, car, car-textures]
    docs: [knowledge/cockpit-blender.md]
    notes: car.glb を読んで車内を合わせるので、先に car-model を作る。

  - id: sign-plates
    name: 道路標識の板と支柱
    purpose: 実寸の標識板（円・逆三角・正方形・一方通行など）と支柱・取付金具。図柄は実行時に sign-textures を貼る。
    kind: model
    files: [public/models/signs.glb]
    generator: { script: scripts/blender/signs.py, recipe: make-sign-model }
    made_by: blender-cli
    source: >-
      自作（bpy で手続きモデリング。板の種類・形・寸法は sign-registry の plates（src/signs/plates.ts）を読む。
      寸法は道路標識、区画線及び道路標示に関する命令 別表第二と警察庁「交通規制基準」による）
    license: repo
    used_by: [src/world/signs.ts]
    inputs: [sign-registry]
    docs: [knowledge/sign-system.md, knowledge/car-model-blender.md, knowledge/road-markings-and-signs.md]
    notes: >-
      G2 から板を src/signs/plates.ts の宣言から作る（それまでは signs.py に寸法を直書き）。移したあとの出力が
      移す前の signs.glb とバイト一致することを確かめた（knowledge/sign-system.md）。ノード名は互換のため固定。

  - id: human
    name: 歩行者
    purpose: 歩道を歩く人・違反を撮影する通行人の体。肩・肘・股・膝で曲がり、服と肌の色は人ごとに材質で変える。
    kind: model
    files: [public/models/human.glb]
    generator: { script: scripts/blender/human.py, recipe: make-human-model }
    made_by: blender-cli
    source: 自作（bpy で手続きモデリング。外部の 3D 素材は使っていない）
    license: repo
    used_by: [src/world/human.ts]
    inputs: [human-textures]
    docs: [knowledge/car-model-blender.md]

  - id: signals
    name: 信号機
    purpose: 交差点と単路の横断歩道の車両用 LED 3 灯横型・歩行者用 2 灯縦型の灯器、信号柱・アーム、単路の押ボタン式の柱に付ける歩行者用押ボタン箱（おまちください灯つき）。点灯はゲームがレンズの色で切り替える。右折矢印段付きは右折専用車線のある交差点に出す。縦型 3 灯と左折・直進・右折の矢印段付きの灯器も入っているが、ゲームではまだ出さない。
    kind: model
    files: [public/models/signals.glb]
    generator: { script: scripts/blender/signals.py, recipe: make-signal-model }
    made_by: blender-cli
    source: 自作（bpy で手続きモデリング。外部の 3D 素材は使っていない）
    license: repo
    used_by: [src/world/signalModels.ts]
    inputs: [signal-heads, signal-textures]
    docs: [knowledge/signal-system.md, knowledge/car-model-blender.md]

  - id: signal-heads
    name: 信号灯器の型と灯の配置
    purpose: src/signals の灯器の宣言から書き出した、灯器ごとの寸法・灯の位置（施行令第3条の並び）・取付の値と、押ボタン箱の寸法・取付高さ。Blender の信号機スクリプトが読む。
    kind: data
    files: [assets/signals/heads.json]
    generator: { script: scripts/signals.ts, recipe: make-signal-layout }
    made_by: procedural
    source: 自作（src/signals/heads.ts・mounts.ts から生成。灯器の寸法はゲームの従来値で、規格の一次情報は未確認。押ボタン箱の高さ 200 mm・地上 900 mm 以上は岐阜県警察「交通安全施設整備工事共通仕様書（信号機及び交通管制システム工事編）」第5節の標準設置姿図、幅・奥行き・ボタンと灯の寸法は仮定）
    license: repo
    used_by: []
    docs: [knowledge/signal-system.md]

