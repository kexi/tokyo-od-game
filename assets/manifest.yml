# アセット台帳: ゲームが使う 3D モデル・テクスチャ・画像・データ・フォント・音声を 1 件ずつ、
# 名前・用途・生成方法・出典・ライセンスとともに管理する。
#
# - スキーマは src/data/assetManifest.ts、検査は tests/assetManifest.test.ts（`just assets-check`）。
#   assets/ と public/（public/data のオープンデータを除く）の全ファイルが、どれか 1 件の files か docs に
#   載っていないとテストが落ちる。新しいアセットを足したら、ここにも足す。
# - アセット管理画面（`just assets` → assets.html）はこの台帳を種類ごとに並べる。
# - files はリポジトリ相対のパスか glob（Node の fs.globSync の書式）。1 つのファイルは 1 件だけが持つ。
# - made_by: blender-cli = Blender CLI の bpy スクリプト、procedural = Claude Code が書いた手続き生成、
#   agy = Antigravity（agy）が書いた手続き生成（受け取り後に確認・修正済み）、external = 外部の配布物、
#   unknown = 作成者の記録が無い。
# - license は下の licenses のキー。used_by は実行時に読み込むソース、inputs は材料にした台帳の id。
# - status: unused は、生成・コミットしてあるがゲームがまだ読み込んでいないもの。

version: 1

licenses:
  repo:
    name: このリポジトリの LICENSE（MIT License）
    url: LICENSE
    notes: >-
      リポジトリ内のスクリプトで作った生成物は、リポジトリの LICENSE に従う扱いにしている。
      README の「ライセンス」節はソースコード（MIT）とデータ（各提供元）だけを書いており、
      生成アセットのライセンスは明文化されていない。
  MIT:
    name: MIT License
    url: https://opensource.org/license/mit
  OFL-1.1:
    name: SIL Open Font License 1.1
    url: https://openfontlicense.org/
  ODbL-1.0:
    name: Open Database License 1.0（OpenStreetMap）
    url: https://opendatacommons.org/licenses/odbl/1-0/
    notes: © OpenStreetMap contributors の帰属表示が要る。抽出したデータベースを公開するなら ODbL で提供する。
  PDL-1.0:
    name: 公共データ利用規約 第1.0版（PLATEAU）
    url: https://www.mlit.go.jp/plateau/site-policy/
    notes: 「国土交通省 PLATEAU … を加工して作成」と加工した旨を書く。
  Apache-2.0:
    name: Apache License 2.0
    url: public/tts/LICENSE-APACHE-2.0.txt
  LicenseRef-sanoTTS-jp-Model-1.0:
    name: sanoTTS-jp Model License 1.0
    url: public/tts/LICENSE-MODEL.md
    notes: 重みに適用。(A) の表示と Apache-2.0 全文の同梱、合成音声の禁止用途 4 項目を利用規約で課すことが義務。
  BSD-3-Clause:
    name: BSD 3-Clause License
    url: https://opensource.org/license/bsd-3-clause
    notes: Open JTalk（名古屋工業大学）と NAIST-JDIC（奈良先端科学技術大学院大学）。全文は public/tts/NOTICE-*.txt。

