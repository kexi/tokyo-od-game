    kind: model
    files: [public/models/car.glb]
    generator: { script: scripts/blender/car.py, recipe: car-model }
    made_by: blender-cli
    source: 自作（bpy で手続きモデリング。寸法は src/physics/vehicle.ts に合わせた。外部の 3D 素材は使っていない）
    license: repo
    used_by: [src/game/carModel.ts]
    inputs: [car-textures]
    docs: [knowledge/car-model-blender.md]

  - id: cockpit
