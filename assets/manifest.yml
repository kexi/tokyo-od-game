    files: [public/models/cockpit.glb]
    generator: { script: scripts/blender/cockpit.py, recipe: cockpit-model }
    made_by: blender-cli
    source: 自作（car.glb のガラスと塗装面から窓の開口を求めて手続きモデリング。写真は配置の参考のみ）
    license: repo
