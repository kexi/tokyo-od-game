<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Opaque facade shadow parity</title>
  <body>
    <script type="module">
      import * as T from "three/webgpu";
      import * as current from "../../src/world/facade";
      import { GRAPHICS } from "../../src/device";
      import { useStableShadows } from "../../src/render/stableShadow";

      const source = await (await fetch(new URL("../../src/world/facade.ts", import.meta.url))).text();
      const pattern =
        /const shadowMaterial = builder.material;\s*const isShadowPass = shadowMaterial.isShadowPassMaterial === true;[\s\S]*?if \(isShadowPass\) return vec4\(0, 0, 0, 1\);/;
      if (!pattern.test(source)) throw new Error("opaque-alpha block not found in served module");
      const oldSource = source
        .replace(pattern, "")
        .replace("return Fn((builder) => {", "return Fn(() => {")
        .replace(/from (["'])\//g, `from $1${location.origin}/`)
        .replace(/^\/\/# sourceMappingURL=.*$/gm, "");
      const referenceURL = URL.createObjectURL(new Blob([oldSource], { type: "text/javascript" }));
      const reference = await import(referenceURL);
      URL.revokeObjectURL(referenceURL);
      await current.loadFacadeTextures();
      reference.facadeUniforms.uFacadeTex.value = current.facadeUniforms.uFacadeTex.value;

      const width = 320;
      const difference = (a, b) => {
        let changed = 0,
          max = 0;
        for (let i = 0; i < a.length; i++) {
          const delta = Math.abs(a[i] - b[i]);
          if (delta !== 0) changed++;
          max = Math.max(max, delta);
        }
        return { changed, max, values: a.length };
      };

      async function capture(module, forceWebGL, mode, night, initiallyMoved = false) {
        GRAPHICS.set({ ...GRAPHICS.settings, windows: mode });
        module.updateFacadeClock(
          new Date(night ? "2026-10-05T12:00:00Z" : "2026-10-05T03:00:00Z"),
          night ? 0.8 : 0,
          18,
        );
        module.facadeUniforms.uNight.value = night ? 1 : 0;
        const renderer = new T.WebGPURenderer({ forceWebGL, antialias: false });
        await renderer.init();
        const backendMatches = forceWebGL
          ? renderer.backend.isWebGLBackend
          : renderer.backend.isWebGPUBackend;
        if (!backendMatches) throw new Error("unexpected backend");
        renderer.setSize(width, width);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = T.PCFShadowMap;
        const scene = new T.Scene();
        scene.background = new T.Color(night ? 0x152033 : 0x9ebbd1);
        const camera = new T.PerspectiveCamera(45, 1, 0.1, 200);
        camera.position.set(35, 35, 40);
        camera.lookAt(0, 5, 0);
        const sun = new T.DirectionalLight(0xffffff, night ? 0.7 : 3);
        sun.position.set(-20, 45, 20);
        sun.castShadow = true;
        sun.shadow.mapSize.set(512, 512);
        Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 0.1, far: 100 });
        sun.shadow.camera.updateProjectionMatrix();
        useStableShadows(sun);
        scene.add(sun, sun.target, new T.AmbientLight(0xffffff, night ? 0.1 : 0.4));
        const floor = new T.Mesh(
          new T.PlaneGeometry(80, 80),
          new T.MeshStandardNodeMaterial({ color: 0xbbbbbb }),
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);
        const buildings = [];
        for (let i = 0; i < 8; i++) {
          const height = 8 + i * 2;
          const geometry = new T.BoxGeometry(5, height, 5);
          const position = geometry.getAttribute("position");
          const facade = new Float32Array(position.count * 2);
          for (let v = 0; v < position.count; v++) {
            facade[v * 2] = i + 0.1 + i * 0.09;
            facade[v * 2 + 1] = position.getY(v) + height / 2;
          }
          geometry.setAttribute("facade", new T.BufferAttribute(facade, 2));
          const mesh = new T.Mesh(geometry, module.facadeMaterial());
          mesh.position.set(((i % 4) - 1.5) * 10, height / 2, (Math.floor(i / 4) - 0.5) * 12);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          scene.add(mesh);
          buildings.push(mesh);
        }
        const shadowBuilds = [];
        renderer.debug.onNodeBuilderCreated = (builder) => {
          const build = builder.build;
          builder.build = function (...args) {
            const start = performance.now();
            try {
              return build.apply(this, args);
            } finally {
              if (this.material.isShadowPassMaterial === true)
                shadowBuilds.push({
                  ms: performance.now() - start,
                  fragment: this.fragmentShader?.length ?? 0,
                });
            }
          };
        };
        const target = new T.RenderTarget(width, width, { type: T.UnsignedByteType });
        const read = async () => {
          renderer.setRenderTarget(target);
          renderer.render(scene, camera);
          await renderer.readRenderTargetPixelsAsync(target, 0, 0, width, width);
          renderer.render(scene, camera);
          return new Uint8Array(await renderer.readRenderTargetPixelsAsync(target, 0, 0, width, width));
        };
        try {
          if (initiallyMoved) buildings[3].position.x += 2.5;
          const pixels = await read();
          buildings[3].position.x += 2.5;
          const moved = await read();
          sun.castShadow = false;
          const noShadows = await read();
          return { pixels, moved, noShadows, shadowBuilds };
        } finally {
          for (const mesh of [floor, ...buildings]) {
            mesh.geometry.dispose();
            mesh.material.dispose();
          }
          await Promise.resolve();
          sun.dispose();
          target.dispose();
          renderer.dispose();
        }
      }

      window.__facadeShadowParity = (async () => {
        const rows = [];
        for (const forceWebGL of [false, true]) {
          for (const mode of ["flat", "lit", "rooms"]) {
            for (const night of [false, true]) {
              const before = await capture(reference, forceWebGL, mode, night);
              const after = await capture(current, forceWebGL, mode, night);
              const freshBefore = await capture(reference, forceWebGL, mode, night, true);
              const freshAfter = await capture(current, forceWebGL, mode, night, true);
              const differences = [
                difference(before.pixels, after.pixels),
                difference(freshBefore.pixels, freshAfter.pixels),
              ];
              const beforeRefresh = difference(before.moved, freshBefore.pixels);
              const afterRefresh = difference(after.moved, freshAfter.pixels);
              const shadowEffect = difference(before.moved, before.noShadows);
              const movementEffect = difference(before.pixels, before.moved);
              const valid =
                differences.every((d) => d.changed === 0) &&
                shadowEffect.changed > 100 &&
                movementEffect.changed > 100;
              const build = (run) => ({
                count: run.shadowBuilds.length,
                ms: run.shadowBuilds.reduce((a, b) => a + b.ms, 0),
                fragments: run.shadowBuilds.map((b) => b.fragment),
              });
              rows.push({
                backend: forceWebGL ? "webgl2" : "webgpu",
                mode,
                night,
                differences,
                shadowEffect,
                movementEffect,
                beforeRefresh,
                afterRefresh,
                valid,
                before: build(before),
                after: build(after),
              });
            }
          }
        }
        return rows;
      })();
    </script>
  </body>
</html>
