# git hook（設置は `lefthook install`。nix develop 入室時に自動実行）。
# CI（.github/workflows/ci.yml）と同じ検査を commit 前に走らせる。
pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --no-banner --redact
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: pnpm exec tsc --noEmit
    - name: oxlint
      glob: "*.{ts,tsx,js,mjs}"
      run: pnpm exec oxlint {staged_files}
    # 対象外（.oxfmtrc.json の ignorePatterns、public/data/** など）のファイルだけを stage した commit で
    # oxfmt が「対象のファイルが無い」と失敗しないよう --no-error-on-unmatched-pattern を付ける。
    # Why not lefthook の exclude に同じ除外を書く: .oxfmtrc.json と 2 か所になり、片方だけ直されてずれる。
    - name: oxfmt
      glob: "*.{ts,tsx,js,mjs,json,css,html,md,yml,yaml}"
      run: pnpm exec oxfmt --check --no-error-on-unmatched-pattern {staged_files}
    - name: justfile
      glob: "justfile"
      run: bash bin/lint-justfile.sh
    - name: pinact
      glob: ".github/workflows/*.{yml,yaml}"
      run: pinact run --check
    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint
    - name: ruff
      glob: "*.py"
      run: ruff format --check {staged_files} && ruff check {staged_files}
    - name: knowledge
      glob: "knowledge/**"
      run: bash bin/lint-knowledge.sh
